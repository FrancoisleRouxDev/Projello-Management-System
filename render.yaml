services:
  - type: web
    name: projello-management-system
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Projello.Api/Dockerfile
    dockerContext: ./backend/Projello.Api
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Database__MigrateOnStartup
        value: "true"
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Jwt__Key
        sync: false
      - key: Cors__AllowedOrigins__0
        value: https://projello-management-system.onrender.com
      - key: Email__SmtpHost
        value: sandbox.smtp.mailtrap.io
      - key: Email__SmtpPort
        value: "2525"
      - key: Email__SmtpUsername
        sync: false
      - key: Email__SmtpPassword
        sync: false
      - key: Email__FromEmail
        sync: false
      - key: Email__FromName
        value: Projello
      - key: Email__FrontendBaseUrl
        value: projello://reset-password
      - key: WebRtc__IceServers__0__Urls__0
        value: stun:stun.l.google.com:19302
      - key: WebRtc__IceServers__1__Urls__0
        sync: false
      - key: WebRtc__IceServers__1__Username
        sync: false
      - key: WebRtc__IceServers__1__Credential
        sync: false
