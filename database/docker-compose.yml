services:
  db:
    image: postgres:16
    container_name: projello-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    restart: unless-stopped
    ports:
      - "127.0.0.1:5434:5432"   # host port 5434 avoids clashing with a local Postgres on 5432/5433
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../backend/Projello.Api
      dockerfile: Dockerfile
    container_name: projello-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "8080"
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Jwt__Key: ${JWT_KEY}
      Database__MigrateOnStartup: "true"
      WebRtc__IceServers__0__Urls__0: ${STUN_URL:-stun:stun.l.google.com:19302}
      CloudinarySettings__CloudName: ${CLOUDINARY_CLOUD_NAME:-}
      CloudinarySettings__ApiKey: ${CLOUDINARY_API_KEY:-}
      CloudinarySettings__ApiSecret: ${CLOUDINARY_API_SECRET:-}
    restart: unless-stopped
    ports:
      - "5049:8080"   # the Electron app expects the API on http://localhost:5049

volumes:
  postgres_data:
